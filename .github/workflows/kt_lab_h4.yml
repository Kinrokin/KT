name: KT laboratory checked-generation courts

on:
  pull_request:
    paths:
      - 'KT_PROD_CLEANROOM/04_PROD_TEMPLE_V2/**'
      - 'KT_PROD_CLEANROOM/tools/operator/run_checked_lab.py'
      - 'KT_PROD_CLEANROOM/tools/operator/local_qwen_worker.py'
      - 'KT_PROD_CLEANROOM/tools/training/lab_neural*.py'
      - 'tests/kt_lab_report.py'
      - 'tests/checked_lab/**'
      - 'scripts/v15_oracle_harvest_common.py'
      - 'scripts/build_v15_oracle_gap_matrix.py'
      - '.github/workflows/kt_lab_h4.yml'
  push:
    branches:
      - 'codex/kt-h4-checked-generation'
      - 'codex/kt-current-evidence-oracle'
      - 'codex/kt-constraint-feedback'
      - 'codex/kt-lab-neural-learning'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checked-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: KT_PROD_CLEANROOM/04_PROD_TEMPLE_V2/src:KT_PROD_CLEANROOM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the preserved proof lock
        run: python -m pip install --require-hashes -r KT_PROD_CLEANROOM/requirements-wave0.lock.txt
      - name: Test strict neural admission and judgment without model libraries
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/KT_PROD_CLEANROOM/04_PROD_TEMPLE_V2/src:$GITHUB_WORKSPACE/KT_PROD_CLEANROOM:$GITHUB_WORKSPACE/tests"
          export KT_REPORT_PATH="$RUNNER_TEMP/neural.events.jsonl"
          python -B -m pytest -p no:cacheprovider -p kt_lab_report -o addopts='' -vv \
            tests/checked_lab/test_lab_neural.py --basetemp="$RUNNER_TEMP/neural" --junitxml="$RUNNER_TEMP/neural.xml"
      - name: Run task and canonical laboratory courts without models
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/KT_PROD_CLEANROOM/04_PROD_TEMPLE_V2/src:$GITHUB_WORKSPACE/KT_PROD_CLEANROOM:$GITHUB_WORKSPACE/tests"
          export KT_REPORT_PATH="$RUNNER_TEMP/h4-court.events.jsonl"
          python -B -m pytest -p no:cacheprovider -p kt_lab_report -o addopts='' -vv \
            tests/checked_lab/test_checked_task.py \
            tests/checked_lab/test_checked_generation.py \
            --basetemp="$RUNNER_TEMP/h4-court" --junitxml="$RUNNER_TEMP/h4-court.xml"
      - name: Replay the complete original focused and full selections plus cap regressions
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/KT_PROD_CLEANROOM/04_PROD_TEMPLE_V2/src:$GITHUB_WORKSPACE/KT_PROD_CLEANROOM:$GITHUB_WORKSPACE/tests"
          cd KT_PROD_CLEANROOM/04_PROD_TEMPLE_V2
          export KT_REPORT_PATH="$RUNNER_TEMP/focused.events.jsonl"
          python -B -m pytest -p no:cacheprovider -p kt_lab_report -o addopts='' -q \
            tests/test_prb_semantic_vertical.py tests/test_prb_semantic_hostile.py \
            tests/test_invariants_gate.py tests/test_wave2a_adapter_activation.py \
            --basetemp="$RUNNER_TEMP/focused" --junitxml="$RUNNER_TEMP/focused.xml"
          export KT_REPORT_PATH="$RUNNER_TEMP/full.events.jsonl"
          python -B -m pytest -p no:cacheprovider -p kt_lab_report -o addopts='' -q \
            tests src/cognition/tests src/council/tests src/curriculum/tests src/multiverse/tests \
            src/paradox/tests src/temporal/tests src/thermodynamics/tests src/tools/tests \
            --basetemp="$RUNNER_TEMP/full" --junitxml="$RUNNER_TEMP/full.xml"
          cd "$GITHUB_WORKSPACE"
          export KT_REPORT_PATH="$RUNNER_TEMP/cap.events.jsonl"
          python -B -m pytest -p no:cacheprovider -p kt_lab_report -o addopts='' -q \
            tests/test_prb_output_token_budget.py --basetemp="$RUNNER_TEMP/cap" --junitxml="$RUNNER_TEMP/cap.xml"
      - name: Check registry, portability and guarded output contracts
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/KT_PROD_CLEANROOM:$GITHUB_WORKSPACE/KT_PROD_CLEANROOM/04_PROD_TEMPLE_V2/src:$GITHUB_WORKSPACE/tests"
          export KT_GROWTH_ARTIFACTS_ROOT="$RUNNER_TEMP/growth-artifacts"
          mkdir -p "$KT_GROWTH_ARTIFACTS_ROOT"
          python -B KT_PROD_CLEANROOM/04_PROD_TEMPLE_V2/tools/check_constitution.py --report "$RUNNER_TEMP/constitutional_guard.md"
          python -B -m scripts.repo_pristine_census --check
          python -B scripts/check_no_bloat.py
          python -B scripts/check_artifact_authority_registry.py
          python -B scripts/check_packet_name_lengths.py
          python -B scripts/check_duplicate_artifacts.py
          python -B scripts/check_stale_head_refs.py
          export KT_REPORT_PATH="$RUNNER_TEMP/ktclean.events.jsonl"
          python -B -m pytest -p no:cacheprovider -p kt_lab_report -o addopts='' -q \
            tests/test_ktclean_readonly_guards.py tests/test_no_unregistered_controlling_artifacts.py \
            tests/test_no_duplicate_current_authority.py tests/test_packet_name_length_policy.py \
            tests/test_no_large_binary_without_allowlist.py tests/test_generated_artifacts_not_current_law.py \
            tests/test_archive_files_not_live_authority.py tests/test_memory_ledger_presence.py tests/test_repo_layout_contract.py \
            --basetemp="$RUNNER_TEMP/ktclean" --junitxml="$RUNNER_TEMP/ktclean.xml"
          export KT_REPORT_PATH="$RUNNER_TEMP/growth.events.jsonl"
          python -B -m pytest -p no:cacheprovider -p kt_lab_report -o addopts='' -q \
            KT_PROD_CLEANROOM/tools/growth/eval_harness_plus/tests/test_eval_harness_plus.py \
            KT_PROD_CLEANROOM/tools/growth/orchestrator/tests/test_epoch_orchestrator.py::TestArtifactsRootOverride \
            --basetemp="$RUNNER_TEMP/growth" --junitxml="$RUNNER_TEMP/growth.xml"
          export KT_REPORT_PATH="$RUNNER_TEMP/livewire.events.jsonl"
          python -B -m pytest -p no:cacheprovider -p kt_lab_report -o addopts='' -q \
            tests/test_livewire_pr_a_stop300_import.py --basetemp="$RUNNER_TEMP/livewire" --junitxml="$RUNNER_TEMP/livewire.xml"
      - name: Record exact-head result and source stability
        if: always()
        run: |
          git rev-parse HEAD HEAD^{tree}
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          python -B - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          if not (Path(os.environ['RUNNER_TEMP']) / 'h4-court.xml').exists():
              raise SystemExit('No JUnit evidence produced')
          for stem in ('neural', 'h4-court', 'focused', 'full', 'cap', 'ktclean', 'growth', 'livewire'):
            for suffix in ('.xml', '.events.jsonl'):
              name = stem + suffix
              path = Path(os.environ['RUNNER_TEMP']) / name
              if not path.exists():
                  print('COURT_EVIDENCE_MISSING=' + name)
                  continue
              raw = path.read_bytes()
              encoded = base64.b64encode(raw).decode()
              print('COURT_FILE=' + name + ':' + hashlib.sha256(raw).hexdigest())
              for number, start in enumerate(range(0, len(encoded), 4096)):
                  print('COURT_CHUNK=' + name + ':' + str(number) + ':' + encoded[start:start+4096])
          PY
